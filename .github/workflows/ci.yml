name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --cov=promptshield --cov-report=term-missing --cov-report=xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: promptshield
          fail_ci_if_error: false
      - name: Upload coverage artifact
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
  lint:
    name: Lint with ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
      # From the dev extra, not a bare `pip install ruff`, so CI runs the same
      # ruff as local use, held by the ceiling in pyproject.toml.
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run ruff check
        run: ruff check promptshield/ tests/ --output-format=github
  typecheck:
    name: Type check with mypy (strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run mypy strict
        run: mypy promptshield/

  # ── Verdict benchmark (issue #3) ────────────────────────────────────────────
  # Runs the eval harness with MOCKED judges, so every push costs nothing.
  #
  # Be clear about what this does and does not prove. With a stubbed judge, the
  # judge's accuracy is a constant the stub decides -- so this job cannot tell
  # you whether Claude got better or worse at judging. What it does test is
  # everything around the judge: that the benchmark file parses, that cases map
  # onto real attacks, that the pattern floor and _combine_verdicts still turn a
  # verdict into the same status, that scoring and the per-class metrics are
  # right, and that the baseline gate actually fails when accuracy drops. Those
  # are the parts a refactor breaks, and they break silently.
  #
  # Judge quality is measured by the LIVE run, which costs money and is therefore
  # run deliberately -- on a model swap, a judge-prompt change, or an attack
  # change -- not on every push. See docs/EVAL_HARNESS.md.
  benchmark:
    name: Verdict benchmark (mocked judges, no API spend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # No API keys are provided to this job, by design: if a code path ever
      # tried to reach a real provider, it would fail here rather than quietly
      # start billing on every push.
      - name: Run the benchmark against the reviewed subset
        run: python -m pytest tests/test_eval_ci_gate.py -v
  backend:
    name: Backend (clean prod install + tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # The lock's --python-version (backend/requirements.txt header), which
          # /api/health confirms is what Railway runs.
          python-version: "3.12"
          cache: "pip"
      # The production way: the hashed lock first, then the engine with
      # --no-deps so none of its dependencies is resolved outside the lock.
      - name: Install the production lock, then promptshield without dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install --no-deps .
          pip check
      - name: Install backend test dependencies from the dev lock
        run: pip install --require-hashes -r backend/requirements-dev.txt
      - name: Run backend tests
        run: |
          cd backend
          python -m pytest tests -v

  # Installs ONLY what Railway installs, in a fresh venv: the root
  # requirements.txt (which includes the hashed backend lock), then the engine
  # with --no-deps. Proves the lock installs on Linux, that the engine's
  # dependencies all come from it and satisfy pyproject.toml's ranges (pip
  # check), that the app sees exactly the lock's versions (what /api/health
  # reports as dependencies_locked), and that the locks still match their .in
  # files. Required by the main ruleset.
  hashed-production-install:
    name: Hashed production install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # pip is not upgraded first: Railway does not either.
      - name: Install exactly what Railway installs
        run: |
          python -m venv "$RUNNER_TEMP/prod"
          "$RUNNER_TEMP/prod/bin/pip" install -r requirements.txt
          "$RUNNER_TEMP/prod/bin/pip" install --no-deps .
      - name: Check the installed set matches the lock
        working-directory: backend
        run: |
          "$RUNNER_TEMP/prod/bin/pip" check
          "$RUNNER_TEMP/prod/bin/python" -c "import main; print('python', main.PYTHON_VERSION, 'dependencies_locked', main.DEPENDENCIES_LOCKED); assert main.DEPENDENCIES_LOCKED, 'installed packages differ from backend/requirements.txt'"
      # uv keeps the pins already in an output file, so recompiling an
      # unchanged .in file reproduces the lock byte for byte. A diff means a .in
      # file changed without regenerating, or a lock was edited by hand. uv is
      # pinned so its output format cannot change underneath the check.
      - name: Check the locks still match their .in files
        working-directory: backend
        run: |
          python -m pip install uv==0.12.18
          uv pip compile requirements.in --universal --python-version 3.12 --generate-hashes --quiet --custom-compile-command "uv pip compile requirements.in --universal --python-version 3.12 --generate-hashes -o requirements.txt" -o requirements.txt
          uv pip compile requirements-dev.in --universal --python-version 3.12 --generate-hashes --quiet --custom-compile-command "uv pip compile requirements-dev.in --universal --python-version 3.12 --generate-hashes -o requirements-dev.txt" -o requirements-dev.txt
          uv pip compile build-requirements.in --universal --python-version 3.12 --generate-hashes --quiet --custom-compile-command "uv pip compile build-requirements.in --universal --python-version 3.12 --generate-hashes -o build-requirements.txt" -o build-requirements.txt
          git diff --exit-code -- requirements.txt requirements-dev.txt build-requirements.txt

  # Builds the root Dockerfile, the image Railway deploys, and proves it starts,
  # reports the right build identity, and can load every file and module a
  # scan reaches lazily. No API keys are passed and no model is called.
  container:
    name: Backend container (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Decoys prove .dockerignore keeps env files out of the image.
      - name: Plant decoy .env files
        run: |
          echo "DECOY=1" > .env
          echo "DECOY=1" > backend/.env

      # Docker Hub rate-limits anonymous pulls per address, and shared runners
      # share addresses, so the base image pull can fail with 429. Google's
      # public Docker Hub mirror serves the same images. The Dockerfile pins the
      # base by digest, so the mirror can only supply that exact image or the
      # build fails. The runner's existing daemon settings are kept.
      - name: Pull Docker Hub images through mirror.gcr.io
        run: |
          cfg=/etc/docker/daemon.json
          current=$(sudo cat "$cfg" 2>/dev/null || echo '{}')
          echo "$current" | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee "$cfg" >/dev/null
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'

      - name: Build the image
        run: docker build --pull -t promptshield-api:ci .

      # No env files, no tests, and none of the evaluation data (the labelled
      # benchmark, the holdouts, the baseline) anywhere in the image.
      - name: Image runs as non-root and holds no env file, tests or benchmark data
        run: |
          uid=$(docker run --rm --entrypoint id promptshield-api:ci -u)
          test "$uid" != "0" || { echo "image runs as root"; exit 1; }
          docker run --rm --entrypoint sh promptshield-api:ci -c '
            found=$(find / -xdev \( -name ".env" -o -name "tests" -path "/app/*" \
                      -o -name "benchmark_v*.yaml" -o -name "holdout_v*.yaml" -o -name "baseline.json" \) \
                      -not -path "/proc/*" 2>/dev/null)
            test -z "$found" || { echo "unexpected files:"; echo "$found"; exit 1; }'

      # PORT=9090 rather than the default 8080, to prove the container listens
      # on whatever port the platform hands it. The commit goes in
      # RAILWAY_GIT_COMMIT_SHA, the variable /api/health reads first in
      # production. FRONTEND_URL is a placeholder origin.
      - name: Start the container and check /api/health
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          docker run -d --name api -p 9090:9090 \
            -e PORT=9090 -e FRONTEND_URL=https://example.com \
            -e RAILWAY_GIT_COMMIT_SHA="$EXPECTED_SHA" promptshield-api:ci
          for i in $(seq 1 30); do
            curl -fsS -o health.json http://127.0.0.1:9090/api/health && break
            sleep 2
          done
          test -s health.json || { echo "no healthy answer in 60s"; exit 1; }
          python3 - <<'EOF'
          import json, os
          h = json.load(open("health.json"))
          assert h["status"] == "ok", h["status"]
          assert h["commit"] == os.environ["EXPECTED_SHA"], h["commit"]
          assert h["python"] == "3.12", h["python"]
          assert h["dependencies_locked"] is True, "installed packages differ from backend/requirements.txt"
          print("health ok:", {k: h[k] for k in ("commit", "python", "dependencies_locked")})
          EOF

      # A scan reads the attack library and imports the judge SDKs only when it
      # runs, so a file or module missing from the image would pass the health
      # check and fail the first real scan. This loads all of them without a
      # network call: no keys are set, so every judge tier is skipped before a
      # client is built, and the pattern analyzer is local.
      - name: Load what a scan reads lazily
        run: |
          docker exec api python -c '
          import scan
          from promptshield.attacks.library import AttackLibrary
          from promptshield.analyzers.pattern import PatternAnalyzer
          from promptshield.analyzers.attack_presentation import EXPENSIVE_OUTPUT_TAG
          from promptshield import model_config
          from promptshield.analyzers.claude_analyzer import ClaudeAnalyzer
          from promptshield.analyzers.gemini_analyzer import GeminiAnalyzer
          from promptshield.analyzers.openai_analyzer import OpenAIAnalyzer
          import anthropic
          from openai import AsyncOpenAI
          from google import genai
          from google.genai import types

          library = AttackLibrary()
          assert library.attacks, "attack library is empty: attacks_v1.yaml is missing from the image"
          assert library.version != "unknown", library.version
          attacks = scan.load_web_demo_attacks()
          assert len(attacks) == 13, len(attacks)
          verdict = PatternAnalyzer().analyze(attacks[0], "I cannot help with that request.")
          assert verdict.success is False, verdict
          assert scan.build_web_analyzers() == [], "a judge was built without a key"
          print("lazy loads ok:", len(library.attacks), "attacks, library", library.version)
          '

      - name: Container logs
        if: always()
        run: docker logs api || true

  frontend:
    name: Frontend (lint + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies from the lockfile
        run: npm ci
      - name: Lint with eslint
        run: npm run lint
      - name: Build with vite
        run: npm run build
      - name: Run vitest
        run: npm test
