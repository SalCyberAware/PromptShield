[build-system]
requires = ["setuptools>=68.0,<85", "wheel"]  # builds the production install (pip install .); held below its next major
build-backend = "setuptools.build_meta"

[project]
name = "promptshield"
version = "0.6.0"
description = "Open-source vulnerability scanner for LLM applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Salah-Adin Mozeb", email = "Sal127@proton.me"}
]
keywords = ["security", "llm", "ai-security", "owasp", "prompt-injection", "vulnerability-scanner", "mitre-atlas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1.7,<9",            # CLI parsing: a major can change option/exit-code behaviour
    "rich>=15.0.0,<16",           # terminal output: a major can change rendering APIs
    "httpx>=0.27.0,<0.29",        # target-API client + retry predicates; 0.x breaks on minors (0.28 dropped proxies=)
    "tenacity>=8.2.0,<10",        # retry/backoff on target calls: a major can change retry semantics
    "pydantic>=2.13.5,<3",        # result models and JSON output: v3 would change validation/serialization
    "anthropic>=0.39.0,<2",       # Claude judge: a major can change messages.create and responses
    "openai>=1.50.0,<4",          # GPT judge + system-prompt scanner: a major can change chat.completions
    "google-genai>=1.0.0,<3",     # Gemini judge: a major can change generate_content
    "ollama>=0.3.0,<0.7",         # local judge; 0.x can break on minors
    "playwright>=1.45.0,<2",      # declared but not imported by the package
    "jinja2>=3.1.4,<4",           # HTML report rendering and autoescape: a major can change both
    "pyyaml>=6.0.1,<7",           # attack library and benchmark loading
    "cryptography>=42.0.0,<51",   # declared but not imported by the package; majors drop platforms/OpenSSL
    "python-dotenv>=1.0.0,<2",    # .env key loading: a major can change lookup/override rules
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10",          # gates CI
    "pytest-asyncio>=0.23.0,<2",  # gates CI: async test mode
    "pytest-cov>=5.0.0,<8",       # gates CI
    "black>=24.0.0",
    "ruff>=0.16.8,<0.17",         # gates CI; 0.x adds rules on minors
    "mypy>=1.10.0,<3",            # gates CI (strict)
]
pdf = [
    "weasyprint>=62.0,<71",       # optional PDF output; declared but not imported
]

[project.urls]
Homepage = "https://github.com/SalCyberAware/PromptShield"
Repository = "https://github.com/SalCyberAware/PromptShield"
Issues = "https://github.com/SalCyberAware/PromptShield/issues"
Documentation = "https://github.com/SalCyberAware/PromptShield/blob/main/README.md"

[project.scripts]
promptshield = "promptshield.cli:main"

[tool.setuptools.packages.find]
include = ["promptshield*"]

[tool.setuptools.package-data]
promptshield = ["attacks/data/*.yaml", "attacks/data/*.json", "reporters/templates/*.j2", "evaluation/data/*.yaml", "evaluation/data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "UP042",  # str+Enum -> StrEnum is a subtle behavior change; defer to a planned refactor.
]

[tool.ruff.lint.per-file-ignores]
"promptshield/cli.py" = ["E501"]                        # banner ASCII art is intentionally wide
"promptshield/analyzers/claude_analyzer.py" = ["E501"]  # system-prompt strings sent verbatim to Claude
"promptshield/analyzers/openai_analyzer.py" = ["E501"]  # system-prompt strings sent verbatim to GPT
"promptshield/analyzers/gemini_analyzer.py" = ["E501"]  # system-prompt strings sent verbatim to Gemini
"promptshield/analyzers/ollama_analyzer.py" = ["E501"]  # system-prompt strings sent verbatim to local LLM
"promptshield/analyzers/pattern.py" = ["E501"]          # detection-reasoning f-string
"promptshield/engines/base.py" = ["E501"]               # verdict-combining expressions
"tests/*.py" = ["E501"]                                 # long method signatures with type hints

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
